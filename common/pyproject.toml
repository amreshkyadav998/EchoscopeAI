[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "echoscope-common"
version = "0.1.0"
description = "Shared utilities for EchoscopeAI microservices (logging, config, exceptions, schemas, ids, correlation)."
requires-python = ">=3.11"
dependencies = [
    "loguru>=0.7",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["echoscope_common*"]
