[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "echoscope-rpc"
version = "0.1.0"
description = "Shared gRPC contracts (protos + generated stubs) + client helpers for EchoscopeAI."
requires-python = ">=3.11"
dependencies = [
    "grpcio>=1.60",
    "protobuf>=4.25",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["echoscope_rpc*"]
