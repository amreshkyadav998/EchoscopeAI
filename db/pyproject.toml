[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "echoscope-db"
version = "0.1.0"
description = "Central database models and migrations for EchoscopeAI."
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["echoscope_db*"]
